<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明新資教盤點系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .active-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">
    <div id="app" class="max-w-md mx-auto px-4">
        <header class="py-6 text-center">
            <h1 class="text-2xl font-bold text-slate-800">明新資教盤點系統</h1>
            <p class="text-sm text-slate-500 mt-1">即時同步 Google Sheets 庫存資料</p>
        </header>

        <div class="mb-4">
            <input v-model="searchQuery" type="text" placeholder="搜尋測驗名稱..." class="w-full p-3 rounded-xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none text-lg">
        </div>

        <div v-if="loading" class="text-center py-20">同步中...</div>

        <div v-else class="space-y-4">
            <div v-for="(item, index) in filteredItems" :key="index" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="h-48 bg-white p-2">
                    <img :src="getImage(item)" class="w-full h-full object-contain">
                </div>

                <div class="p-4">
                    <h2 class="text-lg font-bold text-slate-800 mb-2">{{ getVal(item, '測驗名稱') }}</h2>
                    
                    <div class="flex flex-wrap gap-2 mb-4 text-xs">
                        <span class="bg-blue-50 text-blue-600 px-2 py-1 rounded">類別：{{ getVal(item, '類別') }}</span>
                        <span class="bg-slate-100 text-slate-500 px-2 py-1 rounded">位置：{{ getVal(item, '存放位置') }}</span>
                    </div>

                    <div class="flex items-center justify-between bg-slate-50 p-4 rounded-xl">
                        <span class="font-bold text-slate-700">消耗品份數</span>
                        <div class="flex items-center gap-4">
                            <button @click="updateStock(item, -1)" class="active-btn w-10 h-10 bg-white border border-slate-300 rounded-full flex items-center justify-center text-2xl">-</button>
                            <span class="text-2xl font-black text-blue-600 w-10 text-center">{{ getVal(item, '消耗品份數') || 0 }}</span>
                            <button @click="updateStock(item, 1)" class="active-btn w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center text-2xl">+</button>
                        </div>
                    </div>
                    <p v-if="item.syncing" class="text-[10px] text-center mt-2 text-orange-500 animate-pulse">雲端更新中...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRvSMIJqbvq0lYSLnEghXcDSpWbTg3TxqTdFyh5RoWbih2eOwITfG0k_k6nKKDgs9hrU0ykw3ZlGC3e/pub?output=csv';
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_svkBBn5EJg9A4Btd78uUzZ7sjO4Z1OlZ-Sxs4JPaAkIC-JRnq4UcxKIXfZGLHDI/exec';

        const { createApp, ref, computed, onMounted } = Vue;
        createApp({
            setup() {
                const items = ref([]);
                const loading = ref(true);
                const searchQuery = ref('');

                const getVal = (item, key) => {
                    const found = Object.keys(item).find(k => k.trim().includes(key));
                    return found ? item[found] : '';
                };

                const getImage = (item) => {
                    const url = getVal(item, '圖片');
                    return (url && url.startsWith('http')) ? url : 'https://via.placeholder.com/400x300?text=No+Image';
                };

                const fetchData = () => {
                    Papa.parse(CSV_URL, {
                        download: true, header: true, skipEmptyLines: true,
                        complete: (r) => {
                            items.value = r.data.filter(row => Object.values(row).some(v => v)).map(row => ({...row, syncing: false}));
                            loading.value = false;
                        }
                    });
                };

                const filteredItems = computed(() => items.value.filter(i => getVal(i, '測驗名稱').toLowerCase().includes(searchQuery.value.toLowerCase())));

                const updateStock = async (item, change) => {
                    const stockKey = Object.keys(item).find(k => k.includes('消耗品份數'));
                    if (!stockKey) return;

                    let newNum = (parseInt(item[stockKey]) || 0) + change;
                    if (newNum < 0) return;

                    item[stockKey] = newNum;
                    item.syncing = true;

                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify({ name: getVal(item, '測驗名稱'), newStock: newNum })
                        });
                        setTimeout(() => { item.syncing = false; }, 800);
                    } catch (e) {
                        item.syncing = false;
                    }
                };

                onMounted(fetchData);
                return { loading, searchQuery, filteredItems, getVal, getImage, updateStock };
            }
        }).mount('#app');
    </script>
</body>
</html>
