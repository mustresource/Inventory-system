<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明新資教盤點系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-10">
    <div id="app" class="max-w-md mx-auto px-4">
        <header class="py-6 text-center relative">
            <h1 class="text-2xl font-bold text-slate-800">明新資教盤點系統</h1>
            <button @click="fetchData" class="absolute right-0 top-5 p-4 text-blue-600 z-50">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </header>

        <div v-if="loading" class="text-center py-20 italic text-slate-500">讀取雲端即時資料中...</div>

        <div v-else class="space-y-4">
            <div v-for="(item, index) in items" :key="index" class="bg-white rounded-2xl shadow-sm border p-4">
                <div class="h-40 bg-white mb-2"><img :src="item['圖片 (網址)'] || item['圖片']" class="w-full h-full object-contain"></div>
                <h2 class="text-lg font-bold">{{ item['物品名稱'] }}</h2>
                <div class="flex items-center justify-between bg-slate-50 p-4 rounded-xl mt-4">
                    <span class="font-bold">消耗品份數</span>
                    <div class="flex items-center gap-4">
                        <button @click="updateStock(item, -1)" class="w-10 h-10 bg-white border rounded-full text-2xl">-</button>
                        <span class="text-2xl font-black text-blue-600">{{ item['消耗品份數'] }}</span>
                        <button @click="updateStock(item, 1)" class="w-10 h-10 bg-blue-600 text-white rounded-full text-2xl">+</button>
                    </div>
                </div>
                <div class="h-6 mt-2 text-center">
                    <p v-if="item.syncing" class="text-xs text-orange-500 animate-pulse font-bold">同步中...</p>
                    <p v-else-if="item.success" class="text-xs text-green-500 font-bold">✅ 已同步</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 請確保這是你最新部署的 Apps Script 網址
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_svkBBn5EJg9A4Btd78uUzZ7sjO4Z1OlZ-Sxs4JPaAkIC-JRnq4UcxKIXfZGLHDI/exec';

        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const items = ref([]);
                const loading = ref(true);

                const fetchData = async () => {
                    loading.value = true;
                    try {
                        // 直接向 Apps Script 請求 JSON 資料（繞過 Google CSV 快取）
                        const resp = await fetch(SCRIPT_URL);
                        const data = await resp.json();
                        items.value = data.map(i => ({ ...i, syncing: false, success: false }));
                    } catch (e) { alert("讀取失敗，請確認 Apps Script 已部署為『所有人』"); }
                    loading.value = false;
                };

                const updateStock = async (item, change) => {
                    let newNum = parseInt(item['消耗品份數']) + change;
                    if (newNum < 0) return;
                    
                    item['消耗品份數'] = newNum;
                    item.syncing = true;
                    item.success = false;

                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ name: item['測驗名稱'], newStock: newNum })
                    });

                    item.syncing = false;
                    item.success = true;
                    setTimeout(() => { item.success = false; }, 3000);
                };

                onMounted(fetchData);
                return { items, loading, updateStock, fetchData };
            }
        }).mount('#app');
    </script>
</body>
</html>
